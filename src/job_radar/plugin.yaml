name: job-radar
version: 0.1.0
description: "招聘岗位雷达 — 定时抓取智联/BOSS 岗位，按个人画像打分，生成日报并推送到 QQ"
provides_tools:
  - job_radar_scan
  - job_radar_daily
  - job_radar_list
  - job_radar_mark
  - job_radar_push
  - job_radar_login
  - job_radar_resume_optimize
  - job_radar_resume_list
config_schema:
  keywords: {type: list, default: [], description: "搜索关键词列表。**空 = 抓不到任何东西** —— 去设置页填，或点「填一份示例」看格式"}
  city: {type: str, default: "653", description: "智联城市 jl 代码（单个）。653=杭州 538=上海 530=北京 489=全国。**要抓多个城市用下面的 cities（填城市名）**"}
  cities: {type: list, default: [], description: "要抓的**城市名**列表（如 [重庆, 广州, 南宁, 桂林]）。填名字不填码 —— 码由插件内部翻译。**逐个抓** —— 智联一次只认一个城市，逗号分隔会静默退化成全国。空=只用上面的 city"}
  boss_city: {type: str, default: "101210100", description: "BOSS 城市代码，101210100=杭州"}
  min_score: {type: int, default: 50, description: "日报/推送的入选分数线 0-100"}
  mock: {type: bool, default: false, description: "开发模式：投递闸门/经历/模板转换用假数据"}
  max_jobs_per_run: {type: int, default: 30, description: "单次运行最多抓多少条"}
  sites: {type: list, default: ["zhaopin"], description: "启用哪些站：zhaopin / boss"}
  request_gap_seconds: {type: int, default: 12, description: "两次请求之间的基准间隔（秒）"}
  rounds_per_day: {type: int, default: 4, description: "每天自动抓取几次"}
  push_max: {type: int, default: 3, description: "每次最多推几条岗位到 QQ"}
  push_new_only: {type: bool, default: true, description: "只推送新岗位，不重复推旧的"}
  notify_on_failure: {type: bool, default: true, description: "抓取失败时通知我"}
  active_hours: {type: str, default: "09:00 - 22:00", description: "只在这些时段内抓取"}
  apply_zhaopin: {type: bool, default: false, description: "允许在智联招聘投递简历（第一道门，默认关）"}
  apply_boss: {type: bool, default: false, description: "允许在 BOSS 直聘投递简历（第一道门，默认关）"}
  apply_huibo: {type: bool, default: false, description: "允许在汇博招聘投递简历（第一道门，默认关）"}
  apply_limit_zhaopin: {type: int, default: 5, description: "智联招聘每日投递上限"}
  apply_limit_boss: {type: int, default: 5, description: "BOSS 直聘每日投递上限"}
  apply_limit_huibo: {type: int, default: 3, description: "汇博招聘每日投递上限"}
  smart_template: {type: bool, default: true, description: "由 Agent 按 JD 自行推荐简历模板"}
  template_allow: {type: list, default: [], description: "限定 Agent 只在这些模板里推荐（空=全部）"}
