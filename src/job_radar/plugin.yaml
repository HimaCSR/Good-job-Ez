name: job-radar
version: 0.1.0
description: "招聘岗位雷达 — 定时抓取智联/BOSS 岗位，按个人画像打分，生成日报并推送到 QQ"
provides_tools:
  - job_radar_scan
  - job_radar_daily
  - job_radar_list
  - job_radar_mark
  - job_radar_push
  - job_radar_login
config_schema:
  keywords: {type: list, default: [], description: "搜索关键词列表"}
  city: {type: str, default: "653", description: "智联城市 jl 代码：653=杭州，538=上海，530=北京，489=全国"}
  boss_city: {type: str, default: "101210100", description: "BOSS 城市代码，101210100=杭州"}
  min_score: {type: int, default: 50, description: "日报/推送的入选分数线 0-100"}
  max_jobs_per_run: {type: int, default: 30, description: "单次运行最多抓多少条"}
  sites: {type: list, default: ["zhaopin"], description: "启用哪些站：zhaopin / boss"}
  request_gap_seconds: {type: int, default: 12, description: "两次请求之间的基准间隔（秒）"}
  rounds_per_day: {type: int, default: 4, description: "每天自动抓取几次"}
  push_max: {type: int, default: 3, description: "每次最多推几条岗位到 QQ"}
  push_new_only: {type: bool, default: true, description: "只推送新岗位，不重复推旧的"}
  notify_on_failure: {type: bool, default: true, description: "抓取失败时通知我"}
  active_hours: {type: str, default: "09:00 - 22:00", description: "只在这些时段内抓取"}
