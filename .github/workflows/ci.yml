name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 只允许一个并发跑，省 Actions 配额
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 插件开发机是 Windows 3.14，CI 上多跑几个版本
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r src/job_radar/requirements.txt

      - name: 跑单元测试
        run: |
          cd src/job_radar
          python -m unittest discover -s tests -v

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r src/job_radar/requirements.txt

      - name: 语法检查（所有 py 文件）
        run: |
          python -m compileall -q src/job_radar

      - name: 桌面端 JS 语法检查
        run: |
          node scripts/check-desktop-js.mjs src/job_radar/desktop/plugin.js

      - name: 脱敏扫描
        run: bash scripts/check-sensitive.sh

      - name: 仓库卫生检查
        run: bash scripts/check-repo.sh

  package:
    runs-on: ubuntu-latest
    needs: [test, lint]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 校验插件清单
        run: |
          python - <<'PY'
          import sys, pathlib
          try:
              import yaml
          except ImportError:
              print("::warning::没装 pyyaml，跳过 YAML 校验")
              sys.exit(0)
          p = pathlib.Path("src/job_radar/plugin.yaml")
          data = yaml.safe_load(p.read_text(encoding="utf-8"))
          need = {"name", "version", "description", "provides_tools", "config_schema"}
          missing = need - set(data)
          if missing:
              print(f"::error::plugin.yaml 缺字段: {missing}")
              sys.exit(1)
          # dashboard/manifest.json 也要在
          m = pathlib.Path("src/job_radar/dashboard/manifest.json")
          if not m.exists():
              print("::error::缺 dashboard/manifest.json（后端路由挂不上）")
              sys.exit(1)
          print("清单 OK:", data["name"], data["version"])
          PY
